<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Rekentoets pabo oefenen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Rustig en licht: vlakke achtergrond, witte vlakken met 1px randen, één blauwe accentkleur.
     Afstanden uit de reeks 4 · 8 · 12 · 16 · 24 · 32. Donker gebruikt dezelfde kleurfamilie. */
  --paper: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6;
  --ink: #12161c; --ink-2: #3d4653; --muted: #5f6875; --line: #e1e4e9; --line-2: #c8cdd5;
  --accent: #1d4ed8; --accent-hover: #1a44bd; --accent-ink: #ffffff; --accent-soft: #eef3ff;
  --good: #166534; --good-bg: #edf7f0; --warn: #8a4b00; --warn-bg: #fdf3e1; --bad: #b42318; --bad-bg: #fdeeec;
  --s1: #4a86e8; --s2: #e8743b; --s3: #2aa37a; --s4: #e3a22b; --s5: #d77aa3; --shape: #eaf0f8; --water: #c6dcf5;
  --on-series: #0f1419; --overlay: rgba(15, 20, 25, 0.45);
  /* één letter: Inter, met tabelcijfers zodat getallen in rijen netjes onder elkaar staan.
     Schaal: 13 · 15 · 17 · 20 · 24 · 30, en 48 voor de score. */
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 6px; --r-card: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0f1217; --surface: #171b22; --surface-2: #1f242d;
    --ink: #e8ebf0; --ink-2: #c0c6d0; --muted: #949cab; --line: #2a303a; --line-2: #3d4553;
    --accent: #7aa2ff; --accent-hover: #93b4ff; --accent-ink: #0b1220; --accent-soft: #1c2740;
    --good: #6fcf97; --good-bg: #15291f; --warn: #f0b45a; --warn-bg: #2e2416; --bad: #ff8f85; --bad-bg: #33191a;
    --s1: #5a91ea; --s2: #e07a45; --s3: #2fa57d; --s4: #d9a030; --s5: #d27fa5; --shape: #232a35; --water: #24425f;
    --on-series: #0f1419; --overlay: rgba(0, 0, 0, 0.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0f1217; --surface: #171b22; --surface-2: #1f242d;
  --ink: #e8ebf0; --ink-2: #c0c6d0; --muted: #949cab; --line: #2a303a; --line-2: #3d4553;
  --accent: #7aa2ff; --accent-hover: #93b4ff; --accent-ink: #0b1220; --accent-soft: #1c2740;
  --good: #6fcf97; --good-bg: #15291f; --warn: #f0b45a; --warn-bg: #2e2416; --bad: #ff8f85; --bad-bg: #33191a;
  --s1: #5a91ea; --s2: #e07a45; --s3: #2fa57d; --s4: #d9a030; --s5: #d27fa5; --shape: #232a35; --water: #24425f;
  --on-series: #0f1419; --overlay: rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font: 17px/1.55 var(--f-body); font-variant-numeric: tabular-nums; font-optical-sizing: auto; background: var(--paper); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { line-height: 1.2; margin: 0; text-wrap: balance; font-weight: 700; letter-spacing: -0.015em; }
h1 { font-size: 30px; letter-spacing: -0.022em; }
h2 { font-size: 24px; }
h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.005em; }
p { margin: 0; }
.wrap { max-width: 660px; margin: 0 auto; padding: 24px 16px 112px; display: flex; flex-direction: column; gap: 24px; }
.wrap.run { padding-bottom: 32px; }
.wrap.calc-open { padding-bottom: 416px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.tbl td.tl { text-align: left; }
.score-of { font-size: 0.5em; }
/* twee maten bijtekst: .small (15) en .tiny (13); .hint en .eyebrow zijn dezelfde rustige 13 */
.small { font-size: 15px; color: var(--ink-2); }
.tiny, .hint, .eyebrow { font-size: 13px; color: var(--muted); }
.eyebrow { font-weight: 500; }
.lead { font-size: 17px; color: var(--ink-2); max-width: 34em; }

/* kaarten en knoppen */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card.flat { background: var(--surface-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 8px 16px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); font-size: 15px; font-weight: 600; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); background: var(--surface-2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 40px; padding: 4px 12px; font-size: 15px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-left: 8px; padding-right: 8px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn svg { width: 20px; height: 20px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); }
.pill.good { background: var(--good-bg); color: var(--good); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill svg { width: 14px; height: 14px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 15px; color: var(--ink-2); list-style: none; margin: 0; padding: 0; }
.facts li::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 1px; background: var(--accent); margin-right: 8px; vertical-align: middle; transform: rotate(45deg); }

/* start */
.hero { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.demo { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.modes { display: grid; gap: 12px; }
.mode { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; }
.mode h3 { grid-column: 1; }
.mode .facts { grid-column: 1; }
.mode .btn { grid-column: 2; grid-row: 1 / span 2; }
@media (max-width: 420px) { .mode { grid-template-columns: 1fr; } .mode .btn { grid-column: 1; grid-row: auto; } h1 { font-size: 24px; } }

/* navigatie */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; background: var(--surface); border-top: 1px solid var(--line); }
.tabs-in { display: flex; width: 100%; max-width: 660px; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 500; border-top: 2px solid transparent; margin-top: -1px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); font-weight: 600; }

/* opgave */
.runbar { position: sticky; top: 0; z-index: 15; background: var(--surface); border-bottom: 1px solid var(--line); }
.runbar-in { max-width: 660px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rb-l { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.rb-l b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .rb-l span { font-size: 13px; color: var(--muted); }
.rb-r { display: flex; align-items: center; gap: 8px; }
.timer { font-size: 15px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: var(--surface-2); min-width: 4.6em; text-align: center; }
.timer.low { background: var(--warn-bg); color: var(--warn); }
.rb-prog { height: 4px; background: var(--surface-2); } .rb-prog i { display: block; height: 100%; background: var(--accent); }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.q-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); font-weight: 500; }
.q-meta .pill { font-size: 13px; }
.q-text { font-size: 17px; display: flex; flex-direction: column; gap: 8px; max-width: 36em; }
.q-text .ask, .ask { font-weight: 600; }
.q-fig { display: flex; justify-content: center; }
.sum { font-weight: 600; font-size: 30px; line-height: 1.3; letter-spacing: -0.01em; padding: 4px 0; }
.sum .wrd { font-size: 20px; font-weight: 600; }
.gap { display: inline-block; min-width: 1.5em; text-align: center; border-bottom: 2px solid var(--accent); color: var(--accent); line-height: 1; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: 0.82em; line-height: 1.15; margin: 0 0.18em; font-variant-numeric: tabular-nums; }
.fr > span:first-child { border-bottom: max(1px, 0.05em) solid currentColor; padding: 0 0.25em 1px; }
.fr > span:last-child { padding: 1px 0.25em 0; }
.fr .gap { border-bottom: 0; min-width: 1em; }
.ltr { font-weight: 600; font-size: 1.5em; line-height: 1; }

.fields { display: flex; flex-direction: column; gap: 8px; }
.field { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.f-in { width: 8.5em; max-width: 60vw; min-height: 52px; padding: 8px 12px; font-size: 20px; font-weight: 600; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); }
.f-in:hover { border-color: var(--muted); }
.f-in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent); }
.f-in:disabled { background: var(--surface-2); opacity: 1; }
.f-sign { min-width: 48px; min-height: 48px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface-2); font-size: 20px; font-weight: 600; }
.f-pre, .f-unit { font-weight: 500; color: var(--ink-2); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 52px; padding: 8px 16px 8px 8px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); font-size: 17px; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt-k { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-2); font-size: 13px; font-weight: 600; color: var(--ink-2); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); } .opt.on .opt-k { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.ok { border-color: var(--good); background: var(--good-bg); box-shadow: inset 0 0 0 1px var(--good); } .opt.no { border-color: var(--bad); background: var(--bad-bg); box-shadow: inset 0 0 0 1px var(--bad); }
.opt:disabled { cursor: default; opacity: 1; color: var(--ink); }
.ord { display: flex; flex-direction: column; gap: 12px; }
.ord-seq, .ord-pool { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 48px; }
.ord-seq { padding: 8px; border: 1px dashed var(--line-2); border-radius: var(--r); }
.chip { min-height: 44px; padding: 4px 16px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); font-size: 17px; font-weight: 600; }
.chip.sel { border-color: var(--accent); background: var(--accent-soft); }
.lt { color: var(--muted); }
.actbar { position: sticky; bottom: 0; z-index: 12; background: linear-gradient(transparent, var(--paper) 30%); padding: 16px 0; display: flex; gap: 8px; }
.actbar .btn { flex: 1; }

/* terugkoppeling en uitwerking */
.fb { border-radius: var(--r-card); padding: 16px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--line); border-left-width: 6px; background: var(--surface); }
.fb.ok { border-left-color: var(--good); } .fb.no { border-left-color: var(--bad); }
.fb-h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 17px; }
.fb.ok .fb-h { color: var(--good); } .fb.no .fb-h { color: var(--bad); }
.fb-h svg { width: 22px; height: 22px; flex: none; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 15px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; }
.st { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.st li::marker { color: var(--muted); font-weight: 600; }
.tip { font-size: 15px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; color: var(--ink-2); }
.uitw > summary, details.rev > summary { cursor: pointer; }
.dots { display: inline-flex; gap: 4px; vertical-align: middle; }
.dots i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); } .dots i.on { background: var(--muted); }

/* uitslag en voortgang */
.score { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.score-n { font-weight: 700; font-size: 48px; line-height: 1; letter-spacing: -0.03em; }
.score-l { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding-bottom: 4px; }
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 15px; }
.bar-t { grid-column: 1 / -1; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar-t i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar b { font-variant-numeric: tabular-nums; }
.rev { border-top: 1px solid var(--line); }
.rev > summary { list-style: none; display: grid; grid-template-columns: auto auto 1fr auto; gap: 12px; align-items: center; padding: 12px 0; font-size: 15px; }
.rev > summary::-webkit-details-marker { display: none; }
.rev-n { color: var(--muted); min-width: 1.6em; }
.rev-t { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.rev-i svg { width: 20px; height: 20px; display: block; } .rev-i.ok { color: var(--good); } .rev-i.no { color: var(--bad); }
.rev-b { padding: 4px 0 16px; display: flex; flex-direction: column; gap: 16px; }
.rev[open] > summary { font-weight: 600; }
.chev { width: 16px; height: 16px; color: var(--muted); transition: transform 0.15s; } .rev[open] .chev { transform: rotate(90deg); }
.seg { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line-2); border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.seg button { flex: 1 1 auto; border: 0; background: var(--surface); padding: 8px 12px; min-height: 44px; font-weight: 500; font-size: 15px; color: var(--ink-2); }
.seg button:hover { background: var(--surface-2); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; }
.stats div { background: var(--surface-2); border-radius: var(--r); padding: 8px 12px; }
.stats dt { font-size: 13px; color: var(--muted); } .stats dd { margin: 0; font-weight: 700; font-size: 24px; line-height: 1.2; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.checks { display: grid; gap: 8px; }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); text-align: left; font-weight: 500; }
.check .box { flex: none; width: 20px; height: 20px; border: 1px solid var(--muted); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; }
.check[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); } .check[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check .box svg { width: 14px; height: 14px; opacity: 0; } .check[aria-pressed="true"] .box svg { opacity: 1; }
.check small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.fgroup { display: flex; flex-direction: column; gap: 8px; }
.fgroup > .lab { font-weight: 600; font-size: 15px; }
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; }
.tipbox { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: 4px; padding: 4px 8px; font-size: 13px; line-height: 1.3; transform: translate(-50%, -110%); white-space: nowrap; z-index: 3; }
.tipbox b { font-size: 15px; font-weight: 600; }
table { border-collapse: collapse; }
.tblw { overflow-x: auto; max-width: 100%; }
.tbl { font-size: 15px; line-height: 1.35; margin: 0 auto; }
.tbl caption { text-align: left; font-weight: 600; padding-bottom: 8px; font-size: 15px; }
.tbl th, .tbl td { border: 1px solid var(--line-2); padding: 8px; text-align: right; }
.tbl th { background: var(--surface-2); text-align: left; font-weight: 600; }
.tbl thead th { text-align: center; }
.tbl.wide th, .tbl.wide td { padding: 8px 6px; }
.tbl.sheet { font-size: 13px; }
.tbl.sheet th, .tbl.sheet td { padding: 6px; }
.tbl.sheet th { text-align: center; color: var(--muted); font-weight: 500; min-width: 1.9em; }
.tbl.sheet td { text-align: left; }
.tbl.hist { width: 100%; font-size: 15px; } .tbl.hist td:first-child { white-space: nowrap; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
.list li:first-child { border-top: 0; }
.list .tiny { display: block; }
details.acc { border-top: 1px solid var(--line); } details.acc > summary { cursor: pointer; padding: 12px 0; font-weight: 600; }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 36em; }
.prose ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }

/* rekenmachine en dialoog */
.sheet-ov { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center; }
.calc { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line-2); border-bottom: 0; border-radius: var(--r-card) var(--r-card) 0 0; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 -4px 16px rgba(15, 20, 25, 0.08); }
.calc-top { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 15px; }
.calc-d { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 12px; min-height: 52px; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; overflow: hidden; }
.calc-e { font-size: 15px; color: var(--muted); min-height: 1.3em; word-break: break-all; text-align: right; } .calc-r { font-size: 24px; font-weight: 600; }
.calc-k { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.calc-k button[data-k="P"] { font-size: 13px; }
.calc-k button { min-height: 44px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 500; }
.calc-k button:hover { background: var(--surface-2); }
.calc-k button.op { background: var(--surface-2); } .calc-k button.eq { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); grid-column: span 2; }
.dlg-ov { position: fixed; inset: 0; z-index: 40; background: var(--overlay); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg { background: var(--surface); border-radius: var(--r-card); padding: 24px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--line-2); }

/* figuren */
.fig { width: 100%; max-width: 400px; height: auto; display: block; }
.fig.fig-s { max-width: 190px; } .fig.fig-m { max-width: 280px; } .fig.fig-t { max-width: 150px; }
.figbox { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.figrow { display: flex; justify-content: center; gap: 24px; width: 100%; }
.fig text { font-family: var(--f-body); fill: var(--ink-2); font-size: 12px; }
.fig .ft-title { fill: var(--ink); font-weight: 700; font-size: 13px; } .fig .ft-ax { font-size: 11.5px; fill: var(--muted); }

  def('AH10', 'A', 'H', 'A.5', 'Gemiddelde', (L, r) => {

  const FLOORC = [

  def('AH11', 'A', 'H', 'A.4', 'Delen met rest', (L, r) => {
    const ceil = L === 2 ? r.chance(0.5) : L === 3 ? r.chance(0.5) : false;
    const C = r.pick(ceil ? CEILC : FLOORC), c = r.pick(C.c), N = r.int(C.N[0], C.N[1]), q = Math.floor(N / c), rest = N - q * c;
    if (rest === 0) throw RETRY;
    const base = `${N} : ${c} = ${q} rest ${rest}, want ${q} × ${c} = ${nf(q * c)} en ${N} − ${nf(q * c)} = ${rest}.`;
    if (ceil) {
      if (L === 3) return { type: 'num', q: p(C.t(N, c)) + ask(C.eq), ans: c - rest, expl: steps(base, `Er zijn dus ${q + 1} nodig, met samen ${q + 1} × ${c} = ${nf((q + 1) * c)} plaatsen.`, `${nf((q + 1) * c)} − ${N} = <b>${c - rest}</b>.`) };
      return { type: 'num', q: p(C.t(N, c)) + ask(C.aq), ans: q + 1, expl: steps(base, (rest === 1 ? `Met ${q} kom je er niet: er blijft er dan nog 1 over en die moet ook mee.` : `Met ${q} kom je er niet: de overige ${rest} moeten ook mee.`), `Er zijn er minstens <b>${q + 1}</b> nodig.`) };
    }
    if (L === 1) return { type: 'num', q: p(C.t(N, c)) + ask(C.fq), ans: q, expl: steps(base, `Dat zijn <b>${q}</b> ${C.full}.`) };
    if (L === 2) return { type: 'num', q: p(C.t(N, c)) + ask(C.rq), ans: rest, expl: steps(base, rest === 1 ? 'Er blijft er <b>1</b> over.' : `Er blijven er <b>${rest}</b> over.`) };
    return { type: 'multi', q: p(C.t(N, c)) + ask('Vul beide getallen in.'), fields: [{ ans: q, unit: C.full }, { ans: rest, unit: C.rest }],
      expl: steps(base, `Dus <b>${q}</b> ${C.full} en <b>${rest}</b> ${rest === 1 ? { 'eieren over': 'ei over', 'flessen over': 'fles over', 'ballen over': 'bal over', 'koekjes over': 'koekje over', 'stoelen over': 'stoel over' }[C.rest] || C.rest : C.rest}.`) };
  });

  def('AH12', 'A', 'H', 'A.1', 'Getallen in cijfers schrijven', (L, r) => {
    if (L === 1) {
      let n; do { n = r.int(10001, 99999); } while (String(n).indexOf('0') < 0 || n % 1000 === 0);

      if (f === 2) { const y = r.int(1, 9), n = x * 1e9 + y * 1e8; return { type: 'num', q: p('Schrijf in cijfers:') + som(`${x},${y} miljard`), ans: n, expl: steps(`1 miljard = 1.000.000.000 en 0,1 miljard = 100.000.000.`, `${x} miljard = ${nf(x * 1e9)} en 0,${y} miljard = ${nf(y * 1e8)}.`, `Samen: <b>${nf(n)}</b>.`) + tip('Je typt het getal zonder punten.') }; }
      const y = r.int(11, 99), n = x * 1e6 + y * 1e4; if (y % 10 === 0) throw RETRY;

    }
    const c = r.pick([
      ['2,05 miljard', 2050000000, '1 miljard = 1.000.000.000 en 0,05 miljard = 50.000.000.'],
      ['0,3 miljard', 300000000, '1 miljard = 1.000.000.000, dus 0,3 miljard is drie tiende daarvan.'],
      ['een kwart miljoen', 250000, 'Een kwart van 1.000.000 is 1.000.000 : 4.'],
      ['anderhalf miljoen', 1500000, 'Anderhalf is 1,5. Dus 1.000.000 + 500.000.'],
      ['een half miljard', 500000000, 'De helft van 1.000.000.000.'],
      ['driekwart miljoen', 750000, 'Driekwart van 1.000.000 is 3 × 250.000.'],
      ['4,25 miljoen', 4250000, '4 miljoen = 4.000.000 en 0,25 miljoen = 250.000.'],
      ['12,08 miljoen', 12080000, '12 miljoen = 12.000.000 en 0,08 miljoen = 80.000.'],
      ['1,007 miljard', 1007000000, '1 miljard = 1.000.000.000 en 0,007 miljard = 7.000.000.']
    ]);
    return { type: 'num', q: p('Schrijf in cijfers:') + som(c[0]), ans: c[1], expl: steps(c[2], `Het getal is <b>${nf(c[1])}</b>.`) + tip('Je typt het getal zonder punten.') };
  });

  def('AH13', 'A', 'H', 'A.4', 'Welk getal ontbreekt?', (L, r) => {

      else if (f === 2) { const a = r.int(13, 68), c = r.pick([100, 120, 150, 200]); x = c - a; s = `${gap} + ${a} = ${c}`; ex = steps(`Draai de som om: ${c} − ${a} = <b>${x}</b>.`); }
      else { const a = r.int(3, 12); x = r.int(3, 9); s = `${a * x} : ${gap} = ${a}`; ex = steps(`${a * x} : ${a} = <b>${x}</b>. Controle: ${a * x} : ${x} = ${a}.`); }
    } else if (L === 2) {

      else if (f === 2) { const [a, xs] = r.pick([[25, [8, 12, 16, 24, 40]], [50, [6, 14, 18, 24]], [125, [8, 16, 24]], [250, [4, 8, 12, 16]]]); x = r.pick(xs); s = `${a} × ${gap} = ${nf(a * x)}`; ex = steps(`Draai de som om: ${nf(a * x)} : ${a} = <b>${x}</b>.`); }
      else { const q = r.pick([20, 30, 40, 60, 80]); x = r.pick([20, 30, 40, 50, 60]); s = `${nf(q * x)} : ${gap} = ${q}`; ex = steps(`${nf(q * x)} : ${q} = <b>${x}</b>.`); }
    } else {

      if (f === 1) { const b = r.int(3, 8), a = r.int(5, 25); x = r.int(4, 30); const c = (x + a) * b; s = `(${gap} + ${a}) × ${b} = ${nf(c)}`; ex = steps(`Tussen haakjes moet ${nf(c)} : ${b} = ${(x + a)} staan.`, `${x + a} − ${a} = <b>${x}</b>.`); }
      else if (f === 2) { const a = r.int(3, 9), b = r.int(5, 30); x = r.int(6, 25); const c = a * x - b; s = `${a} × ${gap} − ${b} = ${c}`; ex = steps(`Voordat er ${b} afging, was het ${c} + ${b} = ${c + b}.`, `${c + b} : ${a} = <b>${x}</b>.`); }

  });

  def('AH14', 'A', 'H', 'A.3', 'Getallen ordenen', (L, r) => {

      const d = r.sample([1, 2, 3, 4, 5, 6, 7, 8, 9], 3).concat([0]), set = new Set();
      for (let i = 0; i < 40 && set.size < 4; i++) { const s = r.shuffle(d); if (s[0] !== 0) set.add(s[0] * 1000 + s[1] * 100 + s[2] * 10 + s[3]); }
      if (set.size < 4) throw RETRY;

    const o = ordQ(r, items);
    return Object.assign(o, { q: p('Zet de getallen in de goede volgorde, van klein naar groot.'), expl: steps(ex, `De goede volgorde is: <b>${o.ans.map(i => o.items[i]).join(' &lt; ')}</b>.`) });

  def('AH15', 'A', 'H', 'A.2', 'Rekentaal: som, verschil, product, quotiënt', (L, r) => {
    const DEF = 'Som is optellen, verschil is aftrekken, product is vermenigvuldigen en quotiënt is delen.';
    if (L === 1) {
      const f = r.int(1, 4);
      if (f === 1) { const a = r.int(120, 900), b = r.int(20, a - 15); return { type: 'num', q: p(`Wat is het verschil van ${a} en ${b}?`), ans: a - b, expl: steps(DEF, `${a} − ${b} = <b>${a - b}</b>.`) }; }
      if (f === 2) { const a = r.int(4, 12), b = r.int(6, 15); return { type: 'num', q: p(`Wat is het product van ${a} en ${b}?`), ans: a * b, expl: steps(DEF, `${a} × ${b} = <b>${a * b}</b>.`) }; }
      if (f === 3) { const b = r.int(4, 12), q = r.int(6, 15); return { type: 'num', q: p(`Wat is het quotiënt van ${b * q} en ${b}?`), ans: q, expl: steps(DEF, `${b * q} : ${b} = <b>${q}</b>.`) }; }
      const a = r.int(15, 90), b = r.int(15, 90), c = r.int(15, 90); return { type: 'num', q: p(`Wat is de som van ${a}, ${b} en ${c}?`), ans: a + b + c, expl: steps(DEF, `${a} + ${b} + ${c} = <b>${a + b + c}</b>.`) };
    }
    if (L === 2) {
      const f = r.int(1, 3);
      if (f === 1) { const a = r.int(4, 9), b = r.int(11, 19), d = r.int(4, 12), q = r.int(6, 14); return { type: 'num', q: p(`Tel het product van ${a} en ${b} op bij het quotiënt van ${d * q} en ${d}.`), ans: a * b + q, expl: steps(DEF, `Product: ${a} × ${b} = ${a * b}.`, `Quotiënt: ${d * q} : ${d} = ${q}.`, `${a * b} + ${q} = <b>${a * b + q}</b>.`) }; }
      if (f === 2) { const b = r.int(12, 60), a = b + r.int(8, 40), c = r.int(3, 9); return { type: 'num', q: p(`Vermenigvuldig het verschil van ${a} en ${b} met ${c}.`), ans: (a - b) * c, expl: steps(DEF, `Verschil: ${a} − ${b} = ${a - b}.`, `${a - b} × ${c} = <b>${(a - b) * c}</b>.`) }; }
      const a = r.int(20, 60), b = r.int(5, 18); return { type: 'num', q: p(`Trek het verschil van ${a} en ${b} af van de som van ${a} en ${b}.`), ans: 2 * b, expl: steps(DEF, `Som: ${a} + ${b} = ${a + b}.`, `Verschil: ${a} − ${b} = ${a - b}.`, `${a + b} − ${a - b} = <b>${2 * b}</b>.`) };
    }

  /* ---------- rekenmachine ---------- */

  }

    var canPut = S.ui && S.ui.q.type === 'multi' && S.ui.q.fields.length === 1 && c.res !== '' && c.res !== 'Fout';
    return '<div class="sheet-ov"><section class="calc" role="dialog" aria-label="Rekenmachine"><div class="calc-top"><span>Rekenmachine</span><button class="btn ghost sm" data-act="calc">Sluiten</button></div>' +
      '<div class="calc-d"><div class="calc-e">' + esc(c.expr) + '</div><div class="calc-r" aria-live="polite">' + esc(c.res === '' ? '0' : c.res) + '</div></div><div class="calc-k">' +
      k('C', 'C', 'op', 'Wissen') + k('(', '(', 'op') + k(')', ')', 'op') + k('⌫', 'B', 'op', 'Eén teken terug') +
      k('7', '7') + k('8', '8') + k('9', '9') + k('÷', '÷', 'op', 'Gedeeld door') + k('4', '4') + k('5', '5') + k('6', '6') + k('×', '×', 'op', 'Keer') +
      k('1', '1') + k('2', '2') + k('3', '3') + k('−', '−', 'op', 'Min') + k('0', '0') + k(',', ',') + k('√', '√', 'op', 'Wortel') + k('+', '+', 'op', 'Plus') +
      k('x²', '²', 'op', 'Kwadraat') + (canPut ? k('Antwoord', 'P', 'op', 'Zet de uitkomst in het antwoordvak') : k('±', 'N', 'op', 'Plus of min')) + k('=', '=', 'eq', 'Is gelijk aan') + '</div></section></div>';
  }
  function calcKey(k) {
    var c = S.calc;
    if (k === 'C') { c.expr = ''; c.res = ''; }

    else if (k === '=') { if (c.expr) { try { c.res = calcFmt(calcEval(c.expr)); } catch (e) { c.res = 'Fout'; } } }
    else if (k === 'N') c.expr = c.expr.charAt(0) === '−' ? c.expr.slice(1) : '−' + c.expr;

  function tabs() {
    var cur = S.view === 'result' ? '' : S.view, t = function (v, hash, icon, lab) { return '<a class="tab" href="#' + hash + '" data-act="nav" data-v="' + v + '"' + (cur === v ? ' aria-current="page"' : '') + '>' + icon + '<span>' + lab + '</span></a>'; };
    return '<nav class="tabs" aria-label="Hoofdmenu"><div class="tabs-in">' + t('start', 'start', I.home, 'Start') + t('oefenen', 'oefenen', I.pen, 'Oefenen') + t('voortgang', 'voortgang', I.chart, 'Voortgang') + t('uitleg', 'over-de-toets', I.info, 'Uitleg') + '</div></nav>';
  }
  function dialogHtml() {
    var d = S.dialog;
    return '<div class="dlg-ov"><div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t"><h3 id="dlg-t">' + d.title + '</h3><p>' + d.text + '</p><div class="row"><button class="btn pri" data-act="dlgno" id="dlg-no">' + d.no + '</button><button class="btn" data-act="dlgyes">' + d.yes + '</button></div></div></div>';
  }
  var VIEWS = { start: viewStart, oefenen: viewPractice, voortgang: viewProgress, uitleg: viewInfo, result: viewResult };
  function focusKey(el) {
    if (!el || !el.getAttribute || !app.contains(el)) return null;
    if (el.id) return '#' + el.id;
    var a = el.getAttribute('data-act'); if (!a) return null;
    var sel = '[data-act="' + a + '"]';
    ['data-i', 'data-k', 'data-val', 'data-d', 'data-mode', 'data-v', 'data-id', 'data-et'].forEach(function (n) { var v = el.getAttribute(n); if (v !== null) sel += '[' + n + '="' + v.replace(/["\\]/g, '\\$&') + '"]'; });
    return sel;
  }
  function render() {
    var key = focusKey(document.activeElement), h;
    if (S.view === 'run' && S.s) h = viewRun();
    else { if (S.view === 'run') S.view = 'start'; h = tabs() + '<main class="wrap">' + VIEWS[S.view]() + '</main>'; }
    app.innerHTML = h + (S.dialog ? dialogHtml() : '');
    Array.prototype.forEach.call(app.querySelectorAll('[data-w]'), function (el) { el.style.width = el.getAttribute('data-w') + '%'; });
    if (S.dialog) { var b = document.getElementById('dlg-no'); if (b) b.focus(); return; }
    var el = null; if (key) { try { el = app.querySelector(key); } catch (e) { el = null; } }
    if (el && !el.disabled && el.focus) {
      try { el.focus({ preventScroll: true }); } catch (e2) { el.focus(); }
      if (el.setSelectionRange && el.value) { try { el.setSelectionRange(el.value.length, el.value.length); } catch (e3) { /* niet elk veld kan dit */ } }
    }
  }
  function go(v) {
    S.view = v;
    var hash = { start: 'start', oefenen: 'oefenen', voortgang: 'voortgang', uitleg: 'over-de-toets' }[v];
    if (hash && location.hash !== '#' + hash) { try { location.hash = hash; } catch (e) { /* hash niet beschikbaar */ } }
    render(); window.scrollTo(0, 0);
  }
  function viewFromHash() { return { oefenen: 'oefenen', voortgang: 'voortgang', 'over-de-toets': 'uitleg' }[(location.hash || '').replace('#', '')] || 'start'; }
  function syncSubmit() { var b = document.getElementById('submit'), u = S.ui; if (b && u && !u.checked) b.disabled = !E.isComplete(u.q, u.given); }
  function uiFor(el) { return el.closest('.demo') ? S.demo : S.ui; }

  /* ---------- bediening ---------- */
  var ACT = {
    nav: function (el) { if (S.view === 'run') return; go(el.getAttribute('data-v')); },
    start: function (el) { startTest(el.getAttribute('data-mode')); },
    resume: function () { resume(); },
    discard: function () { LS.del('session'); S.s = null; S.ui = null; render(); },
    begin: function () { beginPart(); },
    next: function () { submitTest(); },
    check: function () { checkPractice(); },
    pnext: function () { showQuestion(); },
    stop: function () {
      var s = S.s; if (!s) return;
      if (s.kind === 'oefen') { if (s.items.length) finish(); else { LS.del('session'); S.s = null; S.ui = null; stopTick(); go('oefenen'); } return; }
      commit(); S.runAt = 0; stopTick();
      S.dialog = { title: 'Toets stoppen?', text: 'Je antwoorden van deze toets worden dan niet bewaard en tellen niet mee in je voortgang.', yes: 'Stoppen', no: 'Doorgaan met de toets', onYes: function () { LS.del('session'); S.s = null; S.ui = null; S.calc.open = false; go('start'); }, onNo: function () { S.runAt = Date.now(); if (S.ui) S.ui.t0 = Date.now(); startTick(); } };
      if (S.ui && S.ui.t0) { S.ui.acc = qElapsed(); S.ui.t0 = null; }
      render();
    },
    dlgyes: function () { var d = S.dialog; S.dialog = null; if (d && d.onYes) d.onYes(); else render(); },
    dlgno: function () { var d = S.dialog; S.dialog = null; if (d && d.onNo) d.onNo(); render(); },
    pick: function (el) { var u = uiFor(el); if (!u || u.checked) return; u.given = +el.getAttribute('data-i'); render(); },
    ordadd: function (el) { var u = S.ui; if (!u || u.checked) return; u.given.push(+el.getAttribute('data-i')); render(); },
    ordrem: function (el) { var u = S.ui; if (!u || u.checked) return; var i = +el.getAttribute('data-i'); u.given = u.given.filter(function (x) { return x !== i; }); render(); },
    sign: function (el) {
      var u = uiFor(el), i = +el.getAttribute('data-i'); if (!u || u.checked) return;
      var inp = el.parentNode.querySelector('.f-in'), v = cleanNum(inp.value); v = v.charAt(0) === '-' ? v.slice(1) : '-' + v;
      inp.value = v; u.given[i] = v; if (u === S.ui) syncSubmit(); inp.focus();
    },
    calc: function () { S.calc.open = !S.calc.open; render(); },
    ck: function (el) { calcKey(el.getAttribute('data-k')); },
    democheck: function () { var u = S.demo; if (!E.isComplete(u.q, u.given)) { var f = document.getElementById('demo0'); if (f) f.focus(); return; } u.ok = E.check(u.q, u.given); u.checked = true; render(); },
    demonew: function () { newDemo(); render(); },
    pdom: function (el) { var d = el.getAttribute('data-d'), i = S.prac.doms.indexOf(d); if (i >= 0) S.prac.doms.splice(i, 1); else S.prac.doms.push(d); S.prac.doms.sort(); LS.set('prac', S.prac); render(); },
    pset: function (el) { var k = el.getAttribute('data-k'), v = el.getAttribute('data-val'); S.prac[k] = k === 'part' ? v : +v; LS.set('prac', S.prac); render(); },
    startprac: function () { if (!pracOptions()) return; startPractice({ doms: S.prac.doms.slice(), part: S.prac.part, level: S.prac.level, count: S.prac.count }); },
    pracdom: function (el) { startPractice({ doms: [el.getAttribute('data-d')], part: 'HN', level: 0, count: 10 }); },
    practpl: function (el) { var t = TPL.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0]; if (t) startPractice({ doms: [t.dom], part: t.part, level: 0, count: 10, tpls: [t.id] }); },
    pracet: function (el) { var e = el.getAttribute('data-et'), ts = TPL.filter(function (x) { return x.et === e || (ET_TPL[e] || []).indexOf(x.id) >= 0; }); if (ts.length) startPractice({ doms: [ts[0].dom], part: 'HN', level: 0, count: 10, tpls: ts.map(function (x) { return x.id; }) }); },
    onlywrong: function () { S.onlyWrong = !S.onlyWrong; render(); },
    filter: function (el) { S.filter = el.getAttribute('data-val'); render(); },
    showlast: function () { var l = LS.get('last'); if (l) { S.result = l; S.onlyWrong = false; S.view = 'result'; render(); window.scrollTo(0, 0); } },
    askclear: function () { S.dialog = { title: 'Voortgang wissen?', text: 'Al je resultaten worden verwijderd. Dit kun je niet ongedaan maken.', yes: 'Wissen', no: 'Bewaren', onYes: function () { S.history = []; S.wiped = Date.now(); LS.set('wiped', S.wiped); LS.del('last'); saveHistory(); render(); } }; render(); }
  };
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-act]') : null; if (!el || el.disabled) return;
    var fn = ACT[el.getAttribute('data-act')]; if (fn) { ev.preventDefault(); fn(el); }
  });
  document.addEventListener('input', function (ev) {
    var el = ev.target; if (!el.classList || !el.classList.contains('f-in')) return;
    var u = uiFor(el), v = cleanNum(el.value); if (v !== el.value) el.value = v;
    if (u && !u.checked) { u.given[+el.getAttribute('data-i')] = v; if (u === S.ui) syncSubmit(); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { if (S.dialog) ACT.dlgno(); else if (S.calc.open) ACT.calc(); return; }
    if (ev.key !== 'Enter' || !ev.target.classList || !ev.target.classList.contains('f-in')) return;
    ev.preventDefault();
    if (ev.target.closest('.demo')) return ACT.democheck();
    var u = S.ui; if (!u || !E.isComplete(u.q, u.given)) return;
    if (S.s.kind === 'test') submitTest(); else if (!u.checked) checkPractice();
  });
  // uitleg bij een punt in de voortgangsgrafiek
  function tipShow(el) {
    var box = el.closest('.chart'), svg = box.querySelector('svg'), r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, tip = box.querySelector('.tipbox');
    if (!tip) { tip = document.createElement('div'); tip.className = 'tipbox'; box.appendChild(tip); }
    tip.innerHTML = el.getAttribute('data-tip');
    var x = +el.getAttribute('cx') / vb.width * r.width, y = +el.getAttribute('cy') / vb.height * r.height;
    tip.style.left = Math.min(Math.max(x, 70), r.width - 70) + 'px'; tip.style.top = Math.max(y, 62) + 'px';
  }
  function tipHide() { var t = document.querySelector('.tipbox'); if (t) t.parentNode.removeChild(t); }
  ['pointerover', 'focusin', 'click'].forEach(function (nmE) { document.addEventListener(nmE, function (ev) { var el = ev.target; if (el.classList && el.classList.contains('pg-hit')) tipShow(el); else if (nmE === 'click') tipHide(); }); });
  ['pointerout', 'focusout'].forEach(function (nmE) { document.addEventListener(nmE, function (ev) { if (ev.target.classList && ev.target.classList.contains('pg-hit')) tipHide(); }); });
  // de klok staat stil als de app niet in beeld is
  document.addEventListener('visibilitychange', function () {
    if (!S.s || S.view !== 'run') return;
    if (document.hidden) { commit(); S.runAt = 0; if (S.ui && S.ui.t0) { S.ui.acc = qElapsed(); S.ui.t0 = null; } saveSession(); }
    else if (!S.dialog) { S.runAt = Date.now(); if (S.ui && !S.ui.checked) S.ui.t0 = Date.now(); }
  });
  window.addEventListener('pagehide', function () { if (S.s && S.view === 'run') { commit(); saveSession(); } });
  window.addEventListener('hashchange', function () { if (S.view === 'run') return; var v = viewFromHash(); if (v !== S.view) { S.view = v; render(); window.scrollTo(0, 0); } });

  /* ---------- opstarten ---------- */
  function boot(data) {
    S.wiped = +LS.get('wiped') || 0; S.history = cleanHist(LS.get('history'), S.wiped);
    var p = LS.get('prac'); if (p && Array.isArray(p.doms)) S.prac = { doms: p.doms.filter(function (d) { return E.DOM[d]; }), part: p.part === 'H' || p.part === 'N' ? p.part : 'HN', level: +p.level || 0, count: p.count === 20 || p.count === 0 ? p.count : 10 };
    var s = LS.get('session'); S.s = s && s.v === 1 && (s.kind === 'test' || s.kind === 'oefen') ? s : null;
    newDemo(); S.view = viewFromHash();
    if (data && data.resume && S.s) resume(); else render();
    cloud.init();
  }
  var hot = window.claude && window.claude.hot, booted = false;
  function start(data) { if (booted) return; booted = true; boot(data && typeof data === 'object' ? data : {}); }
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(function () { return { resume: S.view === 'run' }; }); } catch (e) { /* zonder deze functie start de app gewoon opnieuw */ }
  try {
    if (hot && typeof hot.ready === 'function') { var pr = hot.ready(start); if (pr && typeof pr.then === 'function') pr.then(start, function () { start({}); }); setTimeout(function () { start(hot.data); }, 300); }
    else start(hot && hot.data);
  } catch (e2) { start({}); }
  RWT.app = { S: S, render: render, calcEval: calcEval };
})();

</script>
